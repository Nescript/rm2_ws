controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    chassis_controller:
      type: rm2_chassis_controller/OmniController


chassis_controller:
  ros__parameters:
    # ChassisBase
    publish_rate: 100
    publish_map_tf: true
    publish_odom_tf: true
    slam_topic: "/Odometry"
    localization_topic: "/hdl_global_localization/result"
    power:
      effort_coeff: 6.0
      vel_coeff: 0.004
      power_offset: 0.0
    wheel_radius: 0.049
    twist_angular: 0.5233
    max_odom_vel: 10
    timeout: 0.1
    pid_follow: { p: 5.0, i: 0, d: 0.0, u_clamp_max: 0.0, u_clamp_min: 0.0, activate_state_publisher: false }
    enable_uphill_acceleration: false
    pitch_angle_threshold: -0.25
    scale: 1.0

    # SwerveController
    joint_names:
      wheels:
        - left_front_wheel_joint
        - left_back_wheel_joint
        - right_front_wheel_joint
        - right_back_wheel_joint

      pivots:
        - left_front_pivot_joint
        - left_back_pivot_joint
        - right_front_pivot_joint
        - right_back_pivot_joint

    left_front_wheel_joint:
      radius: 0.049
      pid: { p: 0.3, i: 0, d: 0.0, u_clamp_max: 0.0, u_clamp_min: 0.0, activate_state_publisher: false }

    left_back_wheel_joint:
      radius: 0.049
      pid: { p: 0.3, i: 0, d: 0.0, u_clamp_max: 0.0, u_clamp_min: 0.0, activate_state_publisher: false }

    right_front_wheel_joint:
      radius: 0.049
      pid: { p: 0.3, i: 0, d: 0.0, u_clamp_max: 0.0, u_clamp_min: 0.0, activate_state_publisher: false }

    right_back_wheel_joint:
      radius: 0.049
      pid: { p: 0.3, i: 0, d: 0.0, u_clamp_max: 0.0, u_clamp_min: 0.0, activate_state_publisher: false }

    left_front_pivot_joint:
      position: [0.181, 0.181]
      offset: 0.
      buffer_threshold: 10.0
      effort_threshold: 0.9
      position_error_threshold: 0.1
      max_reduce_cnt: 100.0 #max_reduce_cnt<=256
      pid: { p: 0.8, i: 5.0, d: 0.0, u_clamp_max: 0.4, u_clamp_min: -0.4, activate_state_publisher: false }

    left_back_pivot_joint:
      position: [ -0.181, 0.181 ]
      offset: 0.
      buffer_threshold: 10.0
      effort_threshold: 0.9
      position_error_threshold: 0.1
      max_reduce_cnt: 100.0 #max_reduce_cnt<=256
      pid: { p: 0.8, i: 5.0, d: 0.0, u_clamp_max: 0.4, u_clamp_min: -0.4, activate_state_publisher: false }

    right_front_pivot_joint:
      position: [ 0.181, -0.181 ]
      offset: 0.
      buffer_threshold: 10.0
      effort_threshold: 0.9
      position_error_threshold: 0.1
      max_reduce_cnt: 100.0 #max_reduce_cnt<=256
      pid: { p: 0.8, i: 5.0, d: 0.0, u_clamp_max: 0.4, u_clamp_min: -0.4, activate_state_publisher: false }

    right_back_pivot_joint:
      position: [ -0.181, -0.181 ]
      offset: 0.
      buffer_threshold: 10.0
      effort_threshold: 0.9
      position_error_threshold: 0.1
      max_reduce_cnt: 100.0 #max_reduce_cnt<=256
      pid: { p: 0.8, i: 5.0, d: 0.0, u_clamp_max: 0.4, u_clamp_min: -0.4, activate_state_publisher: false }

